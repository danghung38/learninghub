server:
  port: ${SERVER_PORT}
  servlet:
    context-path: /api/v1

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 11MB
      file-size-threshold: 2KB
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}
      connect-timeout: 2s
      timeout: 2000ms
  cache:
    type: redis
  brevo:
    api-key: ${BREVO_API_KEY}
    from-email: ${BREVO_FROM_EMAIL}
    from-name: Learning Hub
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}

jwt:
  signerKey: ${JWT_KEY}
  valid-duration: 1
  refreshable-duration: 168

openapi:
  service:
    api-docs: learninghub-service
    server: ${OPENAPI_SERVICE_SERVER}
    title: Learning Hub Service
    version: 1.0.0

aws:
  s3.secret-key: ${S3_SECRET_KEY}
  s3.access-key: ${S3_ACCESS_KEY}
  s3.bucket-name: ${S3_BUCKET_NAME}
  s3.base-prefix: ${S3_BASE_PREFIX}

jobs:
  payment-expiration:
    enabled: ${PAYMENT_EXPIRATION_ENABLED}
    initial-delay-ms: 60000
    fixed-delay-ms: 60000

  notification-cleanup:
    enabled: ${NOTIFICATION_CLEANUP_ENABLED}
    cron: "0 0 3 * * *"
    zone: Asia/Ho_Chi_Minh
    retention-days: 60

  advertisement-deactivation:
    enabled: ${ADVERTISEMENT_DEACTIVATION_ENABLED}
    cron: "0 0 0 * * *"
    zone: Asia/Ho_Chi_Minh

  s3-orphan-cleanup:
    enabled: ${S3_ORPHAN_CLEANUP_ENABLED}
    cron: "0 0 3 * * SUN"
    zone: Asia/Ho_Chi_Minh
    grace-hours: 24
    dry-run: ${S3_ORPHAN_DRY_RUN}

  deleted-course-s3-cleanup:
    enabled: ${DELETED_COURSE_S3_CLEANUP_ENABLED:false}
    cron: "0 0 0 * * SUN"
    zone: Asia/Ho_Chi_Minh

withdrawal:
  amount-per-point: ${WITHDRAWAL_AMOUNT_PER_POINT}

payment:
  vnpay:
    pay-url: ${VNPAY_PAY_URL}
    return-url: ${VNPAY_RETURN_URL}
    frontend-return-url: ${VNPAY_FRONTEND_RETURN_URL}
    tmn-code: ${VNPAY_TMN_CODE}
    hash-secret: ${VNPAY_HASH_SECRET}
    version: 2.1.0
    command: pay
    order-type: other
    locale: vn
    amount-per-point: 1000
    expire-minutes: 15
