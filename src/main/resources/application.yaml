server:
  tomcat:
    remote-ip-header: X-Forwarded-For
    protocol-header: X-Forwarded-Proto
    internal-proxies: "127\\.0\\.0\\.1|::1|10\\..*|172\\.16\\..*|192\\.168\\..*"
  port: ${SERVER_PORT}
  servlet:
    context-path: /api/v1

app:
  frontend-url: ${FRONTEND_URL}
  admin:
    username: ${APP_ADMIN_USERNAME}
    password: ${APP_ADMIN_PASSWORD}
    full-name: ${APP_ADMIN_FULL_NAME}
    email: ${APP_ADMIN_EMAIL}
    phone-number: ${APP_ADMIN_PHONE_NUMBER}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 11MB
      file-size-threshold: 2KB
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      database: 0
      connect-timeout: 2s
      timeout: 2000ms
  cache:
    type: redis
  brevo:
    api-key: ${BREVO_API_KEY}
    from-email: ${BREVO_FROM_EMAIL}
    from-name: LearningHub
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

  info:
    env:
      enabled: true

info:
  app:
    name: "Learning Hub Backend Service"
    version: "0.0.1-SNAPSHOT"
    java:
      version: "21.0.5"

jwt:
  signerKey: ${JWT_KEY}
  valid-duration: 1
  refreshable-duration: 168

turnstile:
  secret-key: ${TURNSTILE_SECRET_KEY}
  allowed-hostnames: ${TURNSTILE_ALLOWED_HOSTNAMES}
  siteverify-url: https://challenges.cloudflare.com/turnstile/v0/siteverify

openapi:
  service:
    api-docs: learninghub-service
    server: ${OPENAPI_SERVICE_SERVER}
    title: Learning Hub Service
    version: 1.0.0

aws:
  s3.secret-key: ${S3_SECRET_KEY}
  s3.access-key: ${S3_ACCESS_KEY}
  s3.bucket-name: ${S3_BUCKET_NAME}
  s3.base-prefix: ${S3_BASE_PREFIX}

jobs:
  payment-expiration:
    enabled: true
    initial-delay-ms: 60000
    fixed-delay-ms: 60000

  notification-cleanup:
    enabled: true
    cron: "0 0 3 * * *"
    zone: Asia/Ho_Chi_Minh
    retention-days: 60

  advertisement-deactivation:
    enabled: true
    cron: "0 0 0 * * *"
    zone: Asia/Ho_Chi_Minh

  s3-orphan-cleanup:
    enabled: true
    cron: "0 0 3 * * SUN"
    zone: Asia/Ho_Chi_Minh
    grace-hours: 24 #remove over 24h
    dry-run: false #true = run test

  deleted-course-content-cleanup:
    enabled: true
    cron: "0 0 0 * * *"
    zone: Asia/Ho_Chi_Minh

withdrawal:
  amount-per-point: 800

payment:
  vnpay:
    pay-url: ${VNPAY_PAY_URL}
    return-url: ${VNPAY_RETURN_URL}
    frontend-return-url: ${VNPAY_FRONTEND_RETURN_URL}
    tmn-code: ${VNPAY_TMN_CODE}
    hash-secret: ${VNPAY_HASH_SECRET}
    version: 2.1.0
    command: pay
    order-type: other
    locale: vn
    amount-per-point: 1000
    expire-minutes: 15
